<svg xmlns="http://www.w3.org/2000/svg" width="260" height="280" viewBox="0 0 280 300" role="img" aria-label="Big animated ladybug" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Big animated ladybug</title><style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:100px 190px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.sh{animation:sh 2.6s ease-in-out infinite;transform-origin:100px 192px}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.25}50%{transform:scaleX(.78);opacity:.14}}
.wl{animation:wl 1.3s ease-in-out infinite;transform-origin:100px 88px}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.wr{animation:wr 1.3s ease-in-out infinite;transform-origin:100px 88px}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.eyes{animation:blink 4s infinite;transform-origin:100px 62px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ant{animation:ant 1.8s ease-in-out infinite}
@keyframes ant{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.leg{animation:leg .9s ease-in-out infinite}
@keyframes leg{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.tw{animation:tw 2.2s ease-in-out infinite;transform-origin:0 0}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.ht{animation:ht 3s ease-in infinite;transform-origin:0 0}
@keyframes ht{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
</style><g transform="translate(22,22) scale(1.15)">
