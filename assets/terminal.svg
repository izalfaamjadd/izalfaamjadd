<svg xmlns="http://www.w3.org/2000/svg" width="840" height="466" viewBox="0 0 840 466" role="img" aria-label="Terminal fetch for Izalfa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Izalfa terminal</title><style>
